name: Deploy to ECS (stage)

# stage → stage: build the Twenty image and roll the twenty-server / twenty-worker ECS services in
# the momentum stage account (939603205566, cluster `main`, ECR momentum/twenty). Auth is OIDC via
# the `twenty-publish` role. Other environments have their own accounts; this deploys stage only.
on:
  push:
    branches: [stage]
  workflow_dispatch:

# OIDC: the job assumes the `twenty-publish` IAM role via a short-lived token — no stored keys.
permissions:
  id-token: write
  contents: read

concurrency:
  group: twenty-stage-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: '939603205566'
  ECR_NAMESPACE: momentum
  ECR_REPO: twenty
  ECS_CLUSTER: main
  SERVER_SERVICE: twenty-server
  WORKER_SERVICE: twenty-worker

jobs:
  deploy:
    name: Build & deploy Twenty
    # arm64 runner: the image is built linux/arm64 to match the Fargate task platform.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/twenty-publish
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Build and push immutable release
        run: |
          set -euo pipefail
          IMAGE="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_NAMESPACE/$ECR_REPO"
          APP_VERSION="$(node -p "require('./package.json').version")"
          SHA_TAG="regie-${GITHUB_SHA:0:10}"

          docker buildx build \
            --platform=linux/arm64 \
            --target twenty \
            -f packages/twenty-docker/twenty/Dockerfile \
            --build-arg APP_VERSION="$APP_VERSION" \
            -t "$IMAGE:regie-stage-latest" \
            -t "$IMAGE:$SHA_TAG" \
            --push \
            --progress=plain \
            .

          digest="$(aws ecr describe-images \
            --repository-name "$ECR_NAMESPACE/$ECR_REPO" \
            --image-ids imageTag="$SHA_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve immutable digest for $SHA_TAG" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"

      - name: Upgrade, roll worker, drain backfills, roll server, and converge
        run: .github/scripts/deploy-twenty-ordered.sh
