name: CI Shared

on:
  pull_request:
    branches: [main, develop, stage]
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name == 'run-ci' && 'run' || github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

jobs:
  changed-files-check:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci'
    uses: ./.github/workflows/changed-files.yaml
    with:
      files: |
        packages/twenty-shared/**
  shared-test:
    needs: changed-files-check
    if: needs.changed-files-check.outputs.any_changed == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    strategy:
      matrix:
        task: [lint, typecheck, test]
    steps:
      - name: Fetch custom Github Actions and base branch history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10
      - name: Install dependencies
        uses: ./.github/actions/yarn-install
      - name: Run ${{ matrix.task }} task
        uses: ./.github/actions/nx-affected
        with:
          tag: scope:shared
          tasks: ${{ matrix.task }}
  ci-shared-status-check:
    name: CI Shared Result
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    needs: [changed-files-check, shared-test]
    steps:
      - name: Evaluate required jobs
        id: evaluate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'to_entries | any(.value.result == "cancelled")' <<< "$RESULTS" > /dev/null; then
            STATE=cancelled
            DESCRIPTION="Run cancelled; leaving the previous verdict"
          elif jq -e 'to_entries | any(.value.result == "failure")' <<< "$RESULTS" > /dev/null; then
            STATE=failure
            DESCRIPTION="One or more required Shared CI jobs failed"
          else
            STATE=success
            DESCRIPTION="All required Shared CI jobs passed"
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Publish required status
        if: >-
          github.event_name == 'pull_request' &&
          steps.evaluate.outcome == 'success' &&
          steps.evaluate.outputs.state != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.evaluate.outputs.state }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context="ci-shared-status-check" \
            -f description="$DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null

      - name: Fail when a required job did not pass
        if: steps.evaluate.outputs.state == 'failure'
        run: exit 1
