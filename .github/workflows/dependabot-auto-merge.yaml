name: Dependabot Auto Merge

# This workflow assumes `develop` is the repository default branch. Dependabot
# security PRs then target develop directly, so one CI pass tests the merge base.
on:
  workflow_run:
    workflows: ['CI Twenty Apps']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  validate-and-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    env:
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Resolve direct-to-develop Dependabot PR
        id: pr
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" \
            --jq '.default_branch')
          if [[ "$default_branch" != "develop" ]]; then
            echo "::error::Repository default branch is $default_branch, not develop."
            exit 1
          fi

          pr_json=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$HEAD_BRANCH" --state open \
            --json number,author,baseRefName,url,headRefOid --limit 1)
          number=$(jq -r '.[0].number // empty' <<< "$pr_json")
          author=$(jq -r '.[0].author.login // empty' <<< "$pr_json")
          base=$(jq -r '.[0].baseRefName // empty' <<< "$pr_json")
          url=$(jq -r '.[0].url // empty' <<< "$pr_json")
          head_oid=$(jq -r '.[0].headRefOid // empty' <<< "$pr_json")

          if [[ -z "$number" || "$author" != "dependabot[bot]" ]]; then
            echo "No open Dependabot PR for $HEAD_BRANCH; nothing to do."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$base" != "develop" ]]; then
            echo "PR #$number targets $base instead of develop; not eligible."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$head_oid" != "$HEAD_SHA" ]]; then
            echo "Run SHA $HEAD_SHA is not current PR head $head_oid; skipping stale run."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Resolve Dependabot metadata
        id: metadata-run
        if: steps.pr.outputs.eligible == 'true'
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/dependabot-metadata.yaml/runs" \
              -f event=pull_request \
              -f head_sha="$HEAD_SHA" \
              -f status=success \
              -f per_page=10 \
              --jq '.workflow_runs[0].id // empty')
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 10
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful Dependabot Metadata run for $HEAD_SHA."
            exit 1
          fi
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download Dependabot metadata
        if: steps.pr.outputs.eligible == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dependabot-metadata-${{ env.HEAD_SHA }}
          path: ${{ runner.temp }}/dependabot-metadata
          run-id: ${{ steps.metadata-run.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate update type and app-only scope
        id: validation
        if: steps.pr.outputs.eligible == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          metadata="$RUNNER_TEMP/dependabot-metadata/metadata.json"
          metadata_pr=$(jq -r '.prNumber' "$metadata")
          metadata_sha=$(jq -r '.headSha' "$metadata")
          update_type=$(jq -r '.updateType' "$metadata")

          if [[ "$metadata_pr" != "$PR_NUMBER" || "$metadata_sha" != "$HEAD_SHA" ]]; then
            echo "::error::Metadata does not match PR #$PR_NUMBER at $HEAD_SHA."
            exit 1
          fi
          if [[ "$update_type" != "version-update:semver-patch" && \
                "$update_type" != "version-update:semver-minor" ]]; then
            echo "Update type $update_type requires human review."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[].filename' | sort -u)
          if [[ -z "$changed" ]]; then
            echo "PR #$PR_NUMBER has an empty change set."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          outside=$(grep -vE '^packages/twenty-apps/(public|internal)/' \
            <<< "$changed" || true)
          if [[ -n "$outside" ]]; then
            echo "PR #$PR_NUMBER touches paths outside the app scope:"
            echo "$outside"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          current_pr=$(gh pr view "$PR_URL" --json baseRefName,headRefOid)
          current_base=$(jq -r '.baseRefName' <<< "$current_pr")
          current_head=$(jq -r '.headRefOid' <<< "$current_pr")
          if [[ "$current_base" != "develop" || "$current_head" != "$HEAD_SHA" ]]; then
            echo "::error::PR base or head changed during validation."
            exit 1
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Verify PAT is available
        if: steps.validation.outputs.eligible == 'true'
        env:
          PAT: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
        run: |
          if [[ -z "$PAT" ]]; then
            echo "::error::DEPENDABOT_AUTOMERGE_PAT is unavailable."
            exit 1
          fi

      # Auto-merge waits for every required develop check. The PAT ensures the
      # eventual merge commit triggers the develop deployment workflow.
      - name: Enable auto-merge
        if: steps.validation.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
        run: >
          gh pr merge --auto --merge
          --match-head-commit "$HEAD_SHA"
          "${{ steps.pr.outputs.url }}"
