name: Sync deployed main to stage

# Never react to the stage workflow: stage -> main releases must not create a loop.
on:
  workflow_dispatch:
    inputs:
      production_run_id:
        description: 'Replay a successful push-triggered production run (current main only)'
        required: true
        type: string
  pull_request:
    branches: [main, develop, stage]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/scripts/sync-main-to-stage*'
      - '.github/workflows/sync-main-to-stage.yml'
      - '.github/workflows/stage-ancestry.yaml'
  workflow_run:
    workflows: ['Deploy to ECS (prod)']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_run' && 'sync-deployed-main-to-stage' || format('stage-sync-test-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event.action != 'labeled' || github.event.label.name == 'run-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/sync-main-to-stage.test.cjs

  promote:
    needs: test
    permissions:
      contents: write
      pull-requests: write
      actions: read
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # workflow_run uses trusted default-branch code, never source-PR code.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify automation credential
        env:
          AUTOMATION_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
        run: |
          if [ -z "$AUTOMATION_TOKEN" ]; then
            echo '::error::DEPENDABOT_AUTOMERGE_PAT is required to trigger stage PR CI and deployment.'
            exit 1
          fi

      - name: Promote exact deployed main revision
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
          PRODUCTION_RUN_ID: ${{ inputs.production_run_id }}
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_PAT }}
          script: |
            const { syncMainToStage } = require('./.github/scripts/sync-main-to-stage.cjs');
            // The existing PAT can trigger CI/merges but cannot create PRs.
            const pullRequestGithub = new github.constructor({ auth: process.env.REPOSITORY_TOKEN });
            let promotionContext = context;
            if (context.eventName === 'workflow_dispatch') {
              const id = Number(process.env.PRODUCTION_RUN_ID);
              if (!Number.isSafeInteger(id) || id <= 0) throw new Error('Invalid production run ID.');
              promotionContext = { ...context, payload: { workflow_run: { id } } };
            }
            await syncMainToStage({ github, pullRequestGithub, context: promotionContext, core });
