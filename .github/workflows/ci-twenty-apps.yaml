name: CI Twenty Apps

on:
  pull_request:
    branches: [main, develop, stage]
    types: [labeled]
  workflow_dispatch:
    inputs:
      application:
        description: 'App folder name to test (e.g. "twenty-linear"). Leave empty to test all apps.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.label.name == 'run-ci' && 'run' || github.event.label.name || 'dispatch' }}
  cancel-in-progress: true

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci'
    uses: ./.github/workflows/discover-apps.yaml
    with:
      scope: internal-and-public
      changed-only: true
      application: ${{ inputs.application }}

  ci:
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    name: ${{ matrix.app.name }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ matrix.app.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: yarn
          cache-dependency-path: ${{ matrix.app.path }}/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Typecheck
        if: matrix.app.hasTypecheck
        run: yarn typecheck

      - name: Unit tests
        if: matrix.app.hasUnit
        run: yarn test:unit

  integration:
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    name: ${{ matrix.app.name }} (${{ matrix.server-source }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.discover.outputs.matrix) }}
        server-source: [dockerhub-latest, local]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 10

      - name: Spawn Twenty server
        id: twenty
        if: matrix.app.hasIntegration
        uses: ./.github/actions/spawn-twenty-server
        with:
          source: ${{ matrix.server-source }}

      - name: Test app against server
        if: matrix.app.hasIntegration
        uses: ./.github/actions/test-twenty-app
        with:
          api-url: ${{ steps.twenty.outputs.server-url }}
          api-key: ${{ steps.twenty.outputs.api-key }}
          app-path: ${{ matrix.app.path }}
          mode: ${{ matrix.server-source == 'local' && 'installation-and-integration-test' || 'integration-test-only' }}

  ci-twenty-apps-status-check:
    name: CI Twenty Apps Result
    if: >-
      always() &&
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-ci')
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    needs: [discover, ci, integration]
    steps:
      - name: Evaluate required jobs
        id: evaluate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if jq -e 'to_entries | any(.value.result == "cancelled")' <<< "$RESULTS" > /dev/null; then
            STATE=cancelled
            DESCRIPTION="Run cancelled; leaving the previous verdict"
          elif jq -e 'to_entries | any(.value.result == "failure")' <<< "$RESULTS" > /dev/null; then
            STATE=failure
            DESCRIPTION="One or more required Twenty Apps CI jobs failed"
          else
            STATE=success
            DESCRIPTION="All required Twenty Apps CI jobs passed"
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "description=$DESCRIPTION" >> "$GITHUB_OUTPUT"

      - name: Publish required status
        if: >-
          github.event_name == 'pull_request' &&
          steps.evaluate.outcome == 'success' &&
          steps.evaluate.outputs.state != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.evaluate.outputs.state }}
          DESCRIPTION: ${{ steps.evaluate.outputs.description }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state="$STATE" \
            -f context="ci-twenty-apps-status-check" \
            -f description="$DESCRIPTION" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null

      - name: Fail when a required job did not pass
        if: steps.evaluate.outputs.state == 'failure'
        run: exit 1
